# Nginx site for JVzPay on its EC2 server (docs/DEPLOY-AWS.md §8).
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/jvzpay
#   sudo nano /etc/nginx/sites-available/jvzpay        <- put the three Elastic IPs in the allow list
#   sudo ln -s /etc/nginx/sites-available/jvzpay /etc/nginx/sites-enabled/jvzpay
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d johnvivz-pay.duckdns.org --redirect      <- adds HTTPS (443) and the http -> https redirect
#
# This file is the plain-http starting point; certbot edits the installed copy to add "listen 443 ssl" and the
# certificate lines. The app itself listens only on 127.0.0.1:3002 (HOST=127.0.0.1) and never does TLS.
#
# IMPORTANT for the signed X-JVZ-* requests of the other apps: every proxy_pass below is "http://jvzpay" with NO path
# after it. That way Nginx passes the request path and query string to the app exactly as the caller sent them, and
# the body byte for byte (the signature covers METHOD, path + query, timestamp and the SHA-256 of the raw body).
# Do not add a path or trailing slash to proxy_pass, and do not rewrite or decode these URLs.

upstream jvzpay {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name johnvivz-pay.duckdns.org;

    # Uploads are limited to 5 MB by the app (and JSON bodies to 1 MB); a little more here for the multipart overhead.
    client_max_body_size 8m;

    # don't advertise the Nginx version
    server_tokens off;

    # Common proxy settings (repeated in each location: Nginx does not inherit proxy_set_header into a location that sets
    # its own).
    # X-Forwarded-For is SET to the address Nginx saw (not appended), so a caller cannot fake its address. With
    # TRUST_PROXY=1 the app reads it for sign-in limits, audit logs and sign-in history.

    # ---- Service-to-service API: ONLY the other three JOHNVIVZ servers --------------------------------------------
    # The app serves the API at /api/integration/v1 and (older path) /api/v1. Replace the placeholders with the Elastic
    # IPs of the HR, CRM and Inventory EC2 instances (AWS console -> EC2 -> Elastic IPs). Everyone else gets 403 from
    # Nginx before the request reaches the app.
    # Case-insensitive (~*) on purpose: Express matches routes case-insensitively, so a plain prefix location
    # /api/integration/ would let /API/integration/v1/... slip past the list into location / below.
    location ~* ^/api/(integration|v1)(/|$) {
        allow 203.0.113.10;   # HR        johnvivz-hr.duckdns.org         <- replace with HR's Elastic IP
        allow 203.0.113.20;   # CRM       johnvivz-crm.duckdns.org        <- replace with CRM's Elastic IP
        allow 203.0.113.30;   # Inventory johnvivz-inventory.duckdns.org  <- replace with Inventory's Elastic IP
        deny  all;

        proxy_pass http://jvzpay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # ---- Public health check for monitoring (no data) -------------------------------------------------------------
    location = /health {
        proxy_pass http://jvzpay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Everything else: the web app (sign-in, Self-Service, registration, password reset) -----------------------
    location / {
        proxy_pass http://jvzpay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # reports, exports and backups can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
